plugins { id 'com.android.application' version '8.7.3' }

def origin = providers.gradleProperty('serverUrl').getOrElse('https://xsm.onrender.com')
def url = new URI(origin)
if (url.scheme != 'https' || !url.host || url.userInfo || url.query || url.fragment ||
        !(url.path in ['', '/'])) {
    throw new GradleException('Haqiqiy HTTPS server manzilini -PserverUrl orqali kiriting.')
}

android {
    namespace 'uz.airitom.kpp'
    compileSdk 35
    defaultConfig {
        applicationId 'uz.airitom.kpp'
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName '1.4'
        buildConfigField 'String', 'ORIGIN', groovy.json.JsonOutput.toJson(origin.replaceAll('/$', ''))
    }
    buildFeatures { buildConfig true }
    def signingFile = file('.signing/release.properties')
    if (signingFile.exists()) {
        def credentials = new Properties()
        signingFile.withInputStream { credentials.load(it) }
        signingConfigs {
            localRelease {
                storeFile file('.signing/kpp-release.keystore')
                storePassword credentials.getProperty('password')
                keyAlias 'xsm-kpp'
                keyPassword credentials.getProperty('password')
            }
        }
        buildTypes { release { signingConfig signingConfigs.localRelease } }
    }
    flavorDimensions 'station' 
    productFlavors {
        kpp1 {
            dimension 'station'
            applicationIdSuffix '.ayritom'
            resValue 'string', 'app_name', 'Afg‘oniston darvozasi'
            buildConfigField 'String', 'STATION', '"/dastur/kpp/1"'
        }
        kpp2 {
            dimension 'station'
            applicationIdSuffix '.uz'
            resValue 'string', 'app_name', 'O‘zbekiston darvozasi'
            buildConfigField 'String', 'STATION', '"/dastur/kpp/2"'
        }
    }
}
dependencies { implementation 'com.sunmi:printerlibrary:1.0.18' }
