<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content"><title>Kirish · Airitom</title><link rel="stylesheet" href="/static/kpp.css"></head>
<body class="login-screen"><header><strong>AIRITOM</strong><small>Markaziy boshqaruv</small></header><main><section class="login-panel"><h1>Tizimga kirish</h1>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="device_hw_id" id="login-hw-id"><input type="hidden" name="device_model" id="login-device-model"><label>Login<input name="username" value="{{ username }}" maxlength="40" autocomplete="username" autocapitalize="none" required></label><label>Parol<input name="password" type="password" maxlength="200" autocomplete="current-password" required></label><button class="primary">Kirish</button></form>
</section></main>
<script>
(() => {
  let hwId = "";
  let model = "";
  try {
    if (window.XsmDevice) {
      if (typeof window.XsmDevice.getHardwareId === "function") hwId = window.XsmDevice.getHardwareId() || "";
      if (typeof window.XsmDevice.getDeviceModel === "function") model = window.XsmDevice.getDeviceModel() || "";
    }
  } catch (e) {}
  if (!hwId) {
    try { hwId = localStorage.getItem("xsm_hw_id") || ""; } catch (e) {}
    if (!hwId) {
      hwId = "browser-" + (window.crypto && crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).substring(2, 12));
      try { localStorage.setItem("xsm_hw_id", hwId); } catch (e) {}
    }
  }
  const h = document.getElementById("login-hw-id");
  const m = document.getElementById("login-device-model");
  if (h) h.value = hwId;
  if (m) m.value = model;
})();
</script>
</body></html>
