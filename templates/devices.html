<section id="tab-devices" class="admin-tab hidden">
<header class="page-title"><div><h1>Qurilmalar</h1><p id="devices-status" role="status">Oxirgi signal va ulanish tarixi</p></div><button id="devices-refresh" class="button secondary compact" type="button">Holatni tekshirish</button></header>
<article class="industrial-card table-card"><div class="table-scroll"><table><thead><tr><th>Qurilma</th><th>Nuqta / xodim</th><th>IP manzil</th><th>IMEI / Qurilma ID</th><th>Holati</th><th>Oxirgi signal</th><th>Boshqarish</th></tr></thead><tbody id="devices-rows"></tbody></table></div></article>
<article class="industrial-card table-card"><h2>Ulanish tarixi</h2><div class="table-scroll"><table><thead><tr><th>Vaqt</th><th>Qurilma</th><th>Hodisa</th><th>Oldingi signal</th></tr></thead><tbody id="devices-events"></tbody></table></div><div class="pagination"><label>Sahifada <select id="event-size"><option>10</option><option selected>20</option><option>50</option></select></label><span id="event-total"></span><button id="event-prev" type="button">Oldingi</button><b id="event-page">1 / 1</b><button id="event-next" type="button">Keyingi</button></div></article>
<dialog id="device-editor"><form method="dialog"><label>Qurilma nomi<input id="device-name" maxlength="100" required></label><div><button class="button secondary" value="cancel" formnovalidate>Bekor qilish</button><button class="button primary" value="save">Saqlash</button></div></form></dialog></section>
